<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Dark Shield Base -->
  <path d="M32 4 L56 14 V28 C56 44 45.8 55.4 32 60 C18.2 55.4 8 44 8 28 V14 Z" fill="#090a0f" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Meter Dial Arc -->
  <path d="M20 34 A14 14 0 0 1 44 34" fill="none" stroke="#27272a" stroke-width="3" stroke-linecap="round"/>
  <path d="M20 34 A14 14 0 0 1 38 21" fill="none" stroke="url(#shieldGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Dial Ticks -->
  <line x1="20" y1="34" x2="23" y2="34" stroke="#71717a" stroke-width="1.5"/>
  <line x1="32" y1="20" x2="32" y2="23" stroke="#06b6d4" stroke-width="1.5"/>
  <line x1="44" y1="34" x2="41" y2="34" stroke="#71717a" stroke-width="1.5"/>
  <!-- Electric Energy Bolt -->
  <path d="M34 16 L23 33 H31 L29 48 L42 30 H34 L37 16 Z" fill="url(#boltGrad)" filter="url(#glow)"/>
  <!-- Core Point -->
  <circle cx="32" cy="49" r="2" fill="#10b981"/>
</svg>
