steps:
  # 1. Build the Docker container image for the backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/novo-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/novo-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'

  # 2. Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/novo-backend:$COMMIT_SHA'

  # 3. Deploy to Google Cloud Run with strict cost controls (scale to 0, max 2 instances)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'novo-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/novo-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--set-env-vars'
      - 'STORAGE_BACKEND=supabase,SUPABASE_URL=https://bxnbeatlldxurigjphml.supabase.co,SUPABASE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4bmJlYXRsbGR4dXJpZ2pwaG1sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4MzcyMDgsImV4cCI6MjEwNjQxMzIwOH0.ylevoqrn2jZtXvI0MUV8rDcPYHv5Yt3U4numxdXfbpU,SUPABASE_BUCKET=audit-images'

images:
  - 'gcr.io/$PROJECT_ID/novo-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/novo-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
