[project]
name = "novo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Frank Mathew Sajan", email = "frankmathewsajan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=2.4.0",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
